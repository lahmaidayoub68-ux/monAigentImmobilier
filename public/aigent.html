<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AiGENT — Créez votre AiGENT</title>
    <meta
      name="description"
      content="Concevez, construisez et exportez votre propre AiGENT."
    />
    <link rel="icon" href="./images/aigent.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./aigent.css" />
  </head>
  <body>
    <!-- ─── Icônes (sprite SVG, aucun emoji) ────────────────────────────── -->
    <svg width="0" height="0" hidden aria-hidden="true">
      <symbol id="i-home" viewBox="0 0 24 24">
        <path
          d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"
        />
      </symbol>
      <symbol id="i-chat" viewBox="0 0 24 24">
        <path
          d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H8l-4 4V5a1 1 0 0 1 1-1z"
        />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="i-grid" viewBox="0 0 24 24">
        <path d="M4 5h6v6H4zM14 5h6v6h-6zM4 13h6v6H4zM14 13h6v6h-6z" />
      </symbol>
      <symbol id="i-work" viewBox="0 0 24 24">
        <rect x="3" y="7" width="18" height="14" rx="2" />
        <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18m-11 0v2h4v-2" />
      </symbol>
      <symbol id="i-settings" viewBox="0 0 24 24">
        <path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z" />
        <path d="m19.4 13.5 1.1.8-1.8 3.1-1.3-.6a7.7 7.7 0 0 1-1.7 1l-.2 1.5h-3.6l-.2-1.5a7.7 7.7 0 0 1-1.7-1l-1.3.6-1.8-3.1 1.1-.8a7.2 7.2 0 0 1 0-2.9l-1.1-.8 1.8-3.1 1.3.6a7.7 7.7 0 0 1 1.7-1l.2-1.5h3.6l.2 1.5a7.7 7.7 0 0 1 1.7 1l1.3-.6 1.8 3.1-1.1.8a7.2 7.2 0 0 1 0 2.9Z" />
      </symbol>
      <symbol id="i-play" viewBox="0 0 24 24">
        <path d="M8 5.5v13l11-6.5z" />
      </symbol>
      <symbol id="i-pen" viewBox="0 0 24 24">
        <path d="M4 20h4L20 8l-4-4L4 16z" />
      </symbol>
      <symbol id="i-book" viewBox="0 0 24 24">
        <path d="M4 4h7v16H4zM13 4h7v16h-7z" />
      </symbol>
      <symbol id="i-tool" viewBox="0 0 24 24">
        <path d="M14 3a5 5 0 0 0-4.6 7L3 16.4V21h4.6l6.4-6.4A5 5 0 1 0 14 3z" />
      </symbol>
      <symbol id="i-export" viewBox="0 0 24 24">
        <path
          d="M12 16V4M8 8l4-4 4 4M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"
        />
      </symbol>
      <symbol id="i-globe" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18" />
      </symbol>
      <symbol id="i-code" viewBox="0 0 24 24">
        <path d="m9 8-5 4 5 4M15 8l5 4-5 4" />
      </symbol>
      <symbol id="i-cloud" viewBox="0 0 24 24">
        <path
          d="M7 18a4 4 0 0 1 .6-8 5.5 5.5 0 0 1 10.6 1.4A3.6 3.6 0 0 1 17.5 18z"
        />
      </symbol>
      <symbol id="i-box" viewBox="0 0 24 24">
        <path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z" />
        <path d="M4 7.5 12 12l8-4.5M12 12v9" />
      </symbol>
      <symbol id="i-braces" viewBox="0 0 24 24">
        <path
          d="M8 4c-2 0-2 3-2 4s0 4-2 4c2 0 2 3 2 4s0 4 2 4M16 4c2 0 2 3 2 4s0 4 2 4c-2 0-2 3-2 4s0 4-2 4"
        />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="m5 12.5 4.5 4.5L19 7" />
      </symbol>
      <symbol id="i-back" viewBox="0 0 24 24">
        <path d="M19 12H5M11 6l-6 6 6 6" />
      </symbol>
      <symbol id="i-undo" viewBox="0 0 24 24">
        <path d="M4 9h11a5 5 0 0 1 0 10h-3M4 9l4-4M4 9l4 4" />
      </symbol>
      <symbol id="i-more" viewBox="0 0 24 24">
        <circle cx="5" cy="12" r="1.4" />
        <circle cx="12" cy="12" r="1.4" />
        <circle cx="19" cy="12" r="1.4" />
      </symbol>
      <symbol id="i-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"
        />
      </symbol>
      <symbol id="i-send" viewBox="0 0 24 24">
        <path d="M5 12h13M12 6l6 6-6 6" />
      </symbol>
      <symbol id="i-clip" viewBox="0 0 24 24">
        <path
          d="M17 8.5 9.5 16a3 3 0 0 1-4.2-4.2l8-8a4.5 4.5 0 0 1 6.4 6.4l-8.2 8.2"
        />
      </symbol>
      <symbol id="i-mic" viewBox="0 0 24 24">
        <rect x="9" y="3" width="6" height="11" rx="3" />
        <path d="M5 11a7 7 0 0 0 14 0M12 18v3" />
      </symbol>
      <symbol id="i-warn" viewBox="0 0 24 24">
        <path d="M12 4 2.5 20h19z" />
        <path d="M12 10v4M12 17v.5" />
      </symbol>
      <symbol id="i-link" viewBox="0 0 24 24">
        <path
          d="M10 14a4 4 0 0 0 6 .5l2.5-2.5a4 4 0 0 0-5.7-5.7L11.5 7.7M14 10a4 4 0 0 0-6-.5L5.5 12a4 4 0 0 0 5.7 5.7l1.3-1.3"
        />
      </symbol>
      <!-- APRÈS — icônes propres pour chaque type de carte (fini le logo AiGENT
     répété partout : il reste réservé au bloc "AiGENT réfléchit"). -->
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="M6 6l12 12M18 6 6 18" />
      </symbol>
      <symbol id="i-idea" viewBox="0 0 24 24">
        <path
          d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2h5c.1-.8.5-1.5 1.1-2A6 6 0 0 0 12 3z"
        />
      </symbol>
      <symbol id="i-help" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01" />
      </symbol>
      <symbol id="i-network" viewBox="0 0 24 24">
        <circle cx="12" cy="4.5" r="2" />
        <circle cx="5" cy="18" r="2" />
        <circle cx="19" cy="18" r="2" />
        <path d="M12 6.5v4M10.5 12.5 6.5 16M13.5 12.5l4 3.5M8 12h8" />
      </symbol>
      <symbol id="i-user-id" viewBox="0 0 24 24">
        <circle cx="12" cy="9" r="3.2" />
        <path d="M5.5 20a6.5 6.5 0 0 1 13 0" />
      </symbol>
      <symbol id="i-palette" viewBox="0 0 24 24">
        <path
          d="M12 3a9 9 0 1 0 0 18c1.2 0 2-.9 2-2 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.1 0-.9.7-1.7 1.7-1.7H17a4 4 0 0 0 4-4c0-4.4-4-8-9-8z"
        />
        <circle cx="7.5" cy="11" r="1" />
        <circle cx="10" cy="7.5" r="1" />
        <circle cx="14.5" cy="7.5" r="1" />
        <circle cx="17" cy="11" r="1" />
      </symbol>
      <symbol id="i-toggles" viewBox="0 0 24 24">
        <rect x="3" y="6" width="14" height="6" rx="3" />
        <circle cx="9" cy="9" r="1.6" />
        <rect x="7" y="14" width="14" height="6" rx="3" />
        <circle cx="15" cy="17" r="1.6" />
      </symbol>
      <symbol id="i-clipboard" viewBox="0 0 24 24">
        <rect x="5" y="4" width="14" height="17" rx="2" />
        <path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1M8 12l2.5 2.5L16 9" />
      </symbol>
      <symbol id="i-rocket" viewBox="0 0 24 24">
        <path
          d="M14.5 3.5c2.5 0 4 1.5 4 4-2 .5-4.5 2-6.5 4l-2-2c2-2 4-4.5 4.5-6z"
        />
        <path d="M12 12 5 19M8 15l-3.5 1.5L6 13M9 16l1.5 3.5L14 18" />
      </symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24">
        <path d="M4 7h9M17 7h3M4 17h3M11 17h9" />
        <circle cx="15" cy="7" r="2" />
        <circle cx="9" cy="17" r="2" />
      </symbol>
      <symbol id="i-monitor" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="12" rx="2" />
        <path d="M8 20h8M12 16v4" />
      </symbol>
      <symbol id="i-tablet" viewBox="0 0 24 24">
        <rect x="5" y="3" width="14" height="18" rx="2" />
        <path d="M11 18h2" />
      </symbol>
      <symbol id="i-phone" viewBox="0 0 24 24">
        <rect x="7" y="2.5" width="10" height="19" rx="2" />
        <path d="M11 18.5h2" />
      </symbol>
      <symbol id="i-image" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="2" />
        <circle cx="9" cy="10" r="1.6" />
        <path d="m4 18 5-5 4 4 3-3 4 4" />
      </symbol>
      <symbol id="i-layout" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="2" />
        <path d="M3 9h18M9 9v11" />
      </symbol>
      <symbol id="i-menu" viewBox="0 0 24 24">
        <path d="M4 7h16M4 12h16M4 17h16" />
      </symbol>
      <symbol id="i-type" viewBox="0 0 24 24">
        <path d="M5 7V5h14v2M12 5v14M9 19h6" />
      </symbol>
      <symbol id="i-message" viewBox="0 0 24 24">
        <path d="M4 5h16v11H9l-5 4z" />
      </symbol>
      <symbol id="i-drag" viewBox="0 0 24 24">
        <circle cx="9" cy="6" r="1" />
        <circle cx="15" cy="6" r="1" />
        <circle cx="9" cy="12" r="1" />
        <circle cx="15" cy="12" r="1" />
        <circle cx="9" cy="18" r="1" />
        <circle cx="15" cy="18" r="1" />
      </symbol>
      <symbol id="i-upload" viewBox="0 0 24 24">
        <path d="M12 16V5M8 9l4-4 4 4M5 19h14" />
      </symbol>
    </svg>

    <div class="shell" id="shell">
      <!-- ══ SIDEBAR ══════════════════════════════════════════════════ -->
      <aside class="sidebar">
        <a class="logo" href="./aigent.html">
          <img
            class="aigent-logo aigent-logo-light"
            src="./images/aigent.ico"
            alt=""
          />
          <img
            class="aigent-logo aigent-logo-dark"
            src="./images/aigent.png"
            alt=""
          />
          <span>AiGENT</span>
        </a>

        <nav class="nav" id="nav">
          <a class="nav-item" href="./aigent-chat.html">
            <svg><use href="#i-chat" /></svg>Chat AiGENT
          </a>
          <button class="nav-item is-active" data-view="chat">
            <svg><use href="#i-work" /></svg>Work
          </button>
          <button class="nav-item" data-view="create">
            <svg><use href="#i-plus" /></svg>Créer votre AiGENT
          </button>
          <button class="nav-item" data-view="mine">
            <svg><use href="#i-grid" /></svg>Mes AiGENT
          </button>
          <button class="nav-item" data-view="settings">
            <svg><use href="#i-settings" /></svg>Paramètres
          </button>
        </nav>

        <div class="sidebar-section">
          <p class="sidebar-label">AiGENT spécialisés</p>
          <a class="agent-link" href="/immo.html"
            ><img src="./images/aigent-immo.ico" alt="" /><span
              ><strong>Immo</strong>Immobilier</span
            ></a
          >
          <a class="agent-link" href="/occas.html"
            ><img src="./images/aigent-occas.ico" alt="" /><span
              ><strong>Occas</strong>Véhicules d'occasion</span
            ></a
          >
          <a class="agent-link" href="/emploi.html"
            ><img src="./images/aigent-emploi.ico" alt="" /><span
              ><strong>Emploi</strong>Emploi &amp; Carrière</span
            ></a
          >
          <a class="agent-link" href="/voyage.html"
            ><img src="./images/aigent-voyage.ico" alt="" /><span
              ><strong>Voyage</strong>Voyage &amp; Séjours</span
            ></a
          >
        </div>

        <button class="account" id="account">
          <span class="avatar" id="avatar"></span>
          <span
            ><strong id="accountName">Mon compte</strong
            ><em id="accountSource">—</em></span
          >
        </button>
      </aside>

      <!-- ══ CHAT ═════════════════════════════════════════════════════ -->
      <main class="main">
        <header class="topbar">
          <div class="topbar-id">
            <span class="mark">
              <img
                class="aigent-logo aigent-logo-light"
                src="./images/aigent.ico"
                alt=""
              />
              <img
                class="aigent-logo aigent-logo-dark"
                src="./images/aigent.png"
                alt=""
              />
            </span>
            <div>
              <h1 id="projectTitle">AiGENT</h1>
              <p id="projectSub">Votre intelligence centralisée</p>
            </div>
          </div>
          <nav class="app-mode-switch" aria-label="Espace de travail">
            <a href="./aigent-chat.html">Chat</a>
            <a class="is-current" href="./aigent.html">Work</a>
          </nav>
          <div class="topbar-actions">
            <button
              class="icon-btn"
              id="undoBtn"
              title="Annuler la dernière décision"
              disabled
            >
              <svg><use href="#i-undo" /></svg>
            </button>
            <button class="icon-btn" id="themeBtn" title="Thème">
              <svg><use href="#i-sun" /></svg>
            </button>
            <button class="icon-btn" id="menuBtn" title="Options">
              <svg><use href="#i-more" /></svg>
            </button>
          </div>
        </header>

        <section class="thread" id="thread" aria-live="polite"></section>

        <footer class="composer-wrap">
          <input id="attachmentInput" type="file" multiple accept=".txt,.md,.markdown,.csv,.tsv,.json,.html,.htm,.xml,.log,.yaml,.yml,.sql,.js,.ts,.css,.py" hidden />
          <div class="composer-attachments" id="composerAttachments" aria-live="polite" hidden></div>
          <form class="composer" id="composer" autocomplete="off">
            <span class="composer-mark">
              <img
                class="aigent-logo aigent-logo-light"
                src="./images/aigent.ico"
                alt=""
              />
              <img
                class="aigent-logo aigent-logo-dark"
                src="./images/aigent.png"
                alt=""
              />
            </span>
            <textarea
              id="input"
              rows="1"
              placeholder="Décrivez l'AiGENT que vous voulez créer…"
              aria-label="Votre message"
            ></textarea>
            <button
              type="button"
              class="icon-btn ghost"
              title="Joindre un document"
              id="attachBtn"
            >
              <svg><use href="#i-clip" /></svg>
            </button>
            <button
              type="button"
              class="icon-btn ghost"
              title="Dicter"
              id="micBtn"
            >
              <svg><use href="#i-mic" /></svg>
            </button>
            <button
              type="submit"
              class="send"
              id="sendBtn"
              aria-label="Envoyer"
            >
              <svg><use href="#i-send" /></svg>
            </button>
          </form>
          <p class="composer-hint" id="hint">
            Entrée pour envoyer · Maj + Entrée pour aller à la ligne
          </p>
        </footer>
      </main>

      <!-- ══ PANNEAU PROJET (après construction) ══════════════════════ -->
      <aside class="panel" id="panel" hidden>
        <header class="panel-top">
          <button class="icon-btn" id="panelBack" title="Fermer">
            <svg><use href="#i-back" /></svg>Retour
          </button>
          <button class="icon-btn" id="panelMore" title="Options">
            <svg><use href="#i-more" /></svg>
          </button>
        </header>
        <div class="panel-body" id="panelBody"></div>
      </aside>
    </div>

    <!-- ══ MODALE (code, connaissances, outils, services) ═════════════ -->
    <div class="overlay" id="overlay" hidden>
      <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
      >
        <header class="modal-top">
          <h2 id="modalTitle">Titre</h2>
          <button class="icon-btn" id="modalClose" aria-label="Fermer">
            <svg><use href="#i-close" /></svg>
          </button>
        </header>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script type="module" src="./aigent.js"></script>
  </body>
</html>
